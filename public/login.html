<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e0c; --surface: #1a1916; --gold: #c9a84c; --gold-light: #e8c97a;
      --text: #f0ece4; --muted: #888580; --border: #2e2c28; --danger: #e05c5c;
    }
    body {
      background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 2.5rem; width: 100%; max-width: 380px;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 0.3rem; }
    .sub  { font-size: 0.85rem; color: var(--muted); margin-bottom: 2rem; }
    label { display: block; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
    input {
      width: 100%; background: #0f0e0c; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 0.7rem 0.9rem; font-size: 0.92rem; font-family: 'DM Sans', sans-serif;
      outline: none; transition: border-color 0.2s; margin-bottom: 1rem;
    }
    input:focus { border-color: var(--gold); }
    button {
      width: 100%; background: var(--gold); color: #0f0e0c; border: none; border-radius: 8px;
      padding: 0.8rem; font-size: 0.95rem; font-weight: 600; font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: background 0.2s; margin-top: 0.5rem;
    }
    button:hover { background: var(--gold-light); }
    .error { background: rgba(224,92,92,0.1); border: 1px solid var(--danger); color: var(--danger);
      border-radius: 8px; padding: 0.7rem 1rem; font-size: 0.85rem; margin-bottom: 1.2rem; }
  </style>
</head>
<body>
<div class="box">
  <div class="logo">✦ Admin</div>
  <div class="sub">Sign in to manage your store</div>
  <div id="err" class="error" style="display:none">Invalid credentials — try again.</div>
  <form method="POST" action="/admin/login">
    <label>Username</label>
    <input type="text" name="username" autocomplete="username" required autofocus/>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required/>
    <button type="submit">Sign In →</button>
  </form>
</div>
<script>
  if (location.search.includes('error=1')) document.getElementById('err').style.display = '';
</script>
</body>
</html>
